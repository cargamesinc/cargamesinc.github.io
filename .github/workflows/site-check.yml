name: Check company site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: SITE_MODE=production BUILD_DIR=dist-production python3 company-site/scripts/build.py
      - run: BUILD_DIR=dist-production python3 company-site/scripts/check.py
      - run: python3 company-site/scripts/publish.py --check
